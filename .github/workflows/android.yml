name: Android CI & Release

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build, sign and upload APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      SIGNING_KEY_BASE64: ${{ secrets.SIGNING_KEY }}
      SIGNING_KEY_ALIAS: ${{ secrets.ALIAS }}
      SIGNING_STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
      SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission to Gradle wrapper
        run: chmod +x gradlew scripts/check-project.sh

      - name: Run project checks
        run: ./scripts/check-project.sh

      - name: Read project version
        id: metadata
        shell: bash
        run: |
          VERSION="$(sed -n 's/^val appVersion = "\([^"]*\)"/\1/p' app/build.gradle.kts)"
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "apk_path=app/build/outputs/apk/release/GmailHideAds-v$VERSION.apk" >> "$GITHUB_OUTPUT"

          if [[ "$GITHUB_REF" == refs/tags/v* && "$GITHUB_REF_NAME" != "v$VERSION" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match project version v$VERSION." >&2
            exit 1
          fi

      - name: Check signing configuration
        id: signing
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Pull-request builds are intentionally unsigned because signing secrets are not exposed to PR code."
            exit 0
          fi

          missing=()
          [[ -n "$SIGNING_KEY_BASE64" ]] || missing+=(SIGNING_KEY)
          [[ -n "$SIGNING_KEY_ALIAS" ]] || missing+=(ALIAS)
          [[ -n "$SIGNING_STORE_PASSWORD" ]] || missing+=(STORE_PASSWORD)
          [[ -n "$SIGNING_KEY_PASSWORD" ]] || missing+=(KEY_PASSWORD)

          if (( ${#missing[@]} > 0 )); then
            printf 'Missing required GitHub Actions secrets: %s\n' "${missing[*]}" >&2
            echo "Add all four secrets under Settings > Secrets and variables > Actions." >&2
            exit 1
          fi

          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: Decode and verify release keystore
        if: steps.signing.outputs.enabled == 'true'
        shell: bash
        run: |
          KEYSTORE="$RUNNER_TEMP/gmailhideads-release.keystore"

          # Every diagnosis below is emitted as a workflow annotation, not just
          # to stderr, so it can be read without downloading the job log.
          #
          # This step runs under `set -eo pipefail`, so a failing pipeline would
          # otherwise abort before its own error message is reached; each check
          # is therefore written as a condition rather than a bare command.

          # A base64 secret copied out of a Windows text file carries CR
          # characters, and GNU base64 rejects those outright rather than
          # ignoring them, leaving a truncated keystore behind.
          if ! printf '%s' "$SIGNING_KEY_BASE64" | tr -d '[:space:]' | base64 --decode > "$KEYSTORE" 2>/dev/null; then
            echo "::error::SIGNING_KEY is not valid base64. Re-copy keystore-base64.txt with every line break removed."
            exit 1
          fi
          chmod 600 "$KEYSTORE"

          if [[ ! -s "$KEYSTORE" ]]; then
            echo "::error::SIGNING_KEY decoded to an empty file. The secret is blank or truncated."
            exit 1
          fi

          # Size and format are not secret, and knowing them separates a bad
          # paste from a bad password without revealing any key material.
          echo "::notice::Keystore decoded: $(wc -c < "$KEYSTORE") bytes."

          # A password pasted with a trailing newline is the likeliest cause of
          # a signing failure, and the error Gradle raises for it does not say so.
          check_whitespace() {
            if [[ "$2" != "$(printf '%s' "$2" | tr -d '[:space:]')" ]]; then
              echo "::warning::Secret $1 contains whitespace. A trailing newline from copy-paste will break signing."
            fi
          }
          check_whitespace ALIAS "$SIGNING_KEY_ALIAS"
          check_whitespace STORE_PASSWORD "$SIGNING_STORE_PASSWORD"
          check_whitespace KEY_PASSWORD "$SIGNING_KEY_PASSWORD"

          # Fail here, in seconds and with a usable message, rather than inside
          # a Gradle stack trace ninety seconds into the build. keytool reads
          # the password from the environment so it never reaches the process
          # list, and its output is discarded so no certificate detail is logged.
          export KEYSTORE_PASSWORD="$SIGNING_STORE_PASSWORD"

          if ! keytool -list -keystore "$KEYSTORE" -storepass:env KEYSTORE_PASSWORD > /dev/null 2>&1; then
            echo "::error::STORE_PASSWORD was rejected. The keystore decoded correctly, so this secret is wrong or carries a trailing newline."
            exit 1
          fi

          if ! keytool -list -keystore "$KEYSTORE" -storepass:env KEYSTORE_PASSWORD -alias "$SIGNING_KEY_ALIAS" > /dev/null 2>&1; then
            echo "::error::STORE_PASSWORD is correct, but ALIAS does not name a key in this keystore."
            exit 1
          fi

          echo "::notice::Keystore verified: STORE_PASSWORD and ALIAS both accepted."

      - name: Build release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/gmailhideads-release.keystore
          ANDROID_KEYSTORE_ALIAS: ${{ env.SIGNING_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ env.SIGNING_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ env.SIGNING_KEY_PASSWORD }}
        run: ./gradlew clean assembleRelease --no-daemon --stacktrace

      - name: Locate and verify APK
        id: apk
        shell: bash
        run: |
          APK_PATH="${{ steps.metadata.outputs.apk_path }}"
          test -f "$APK_PATH"
          echo "path=$APK_PATH" >> "$GITHUB_OUTPUT"

          if [[ "${{ steps.signing.outputs.enabled }}" == "true" ]]; then
            APKSIGNER="$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
            test -n "$APKSIGNER"
            "$APKSIGNER" verify --verbose --print-certs "$APK_PATH"
          else
            echo "Unsigned pull-request APK built successfully."
          fi

      - name: Upload APK to workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GmailHideAds-v${{ steps.metadata.outputs.version }}-${{ github.run_number }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Publish APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Gmail Hide Ads v${{ steps.metadata.outputs.version }}
          body_path: RELEASE_NOTES.md
          files: ${{ steps.apk.outputs.path }}
          fail_on_unmatched_files: true
          token: ${{ github.token }}
